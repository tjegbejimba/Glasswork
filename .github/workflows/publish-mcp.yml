name: Publish MCP
run-name: Publish MCP v${{ inputs.version }} from ${{ inputs.source_ref || 'main' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "glasswork-mcp version in X.Y.Z form"
        required: true
        type: string
      source_ref:
        description: "Exact commit in main history to publish (defaults to current main)"
        required: false
        type: string

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve publication state
        id: preflight
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          MCP_VERSION: ${{ inputs.version }}
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $credential = [Convert]::ToBase64String(
              [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:APP_TOKEN"))
          Write-Output "::add-mask::$credential"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $credential" `
              fetch origin main --tags --force
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch current origin/main and tags."
          }
          $head = (& git rev-parse HEAD).Trim()
          $remoteMain = (& git rev-parse origin/main).Trim()
          if ($head -ne $remoteMain) {
              throw "Publication checkout '$head' is not current origin/main '$remoteMain'."
          }

          $tag = "mcp-v$env:MCP_VERSION"
          $matchingRefs = & git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to check MCP tag '$tag'."
          }
          $tagExists = -not [string]::IsNullOrWhiteSpace($matchingRefs)

          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to enumerate GitHub Releases."
          }
          $matchingReleases = @(
              $releasesJson |
                  ConvertFrom-Json |
                  Where-Object { $_.tag_name -eq $tag }
          )
          if ($matchingReleases.Count -gt 1) {
              throw "Multiple GitHub Releases use MCP tag '$tag'."
          }
          $releaseExists = $matchingReleases.Count -eq 1
          $releaseIsDraft = $releaseExists -and [bool]$matchingReleases[0].draft

          . .\scripts\Validate-McpReleasePublication.ps1
          $state = Resolve-McpPublicationState `
              -ReleaseExists $releaseExists `
              -ReleaseIsDraft $releaseIsDraft `
              -TagExists $tagExists

          $sourceRef = $env:REQUESTED_SOURCE_REF
          if ([string]::IsNullOrWhiteSpace($sourceRef)) {
              $sourceRef = "origin/main"
          }
          $requestedSourceRevision = (& git rev-parse "$sourceRef^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $requestedSourceRevision -notmatch '^[0-9a-f]{40}$') {
              throw "Unable to resolve MCP publication source '$sourceRef'."
          }
          & git merge-base --is-ancestor $requestedSourceRevision origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "MCP publication source '$requestedSourceRevision' is not in current main history."
          }

          $sourceRevision = $requestedSourceRevision
          if ($tagExists) {
              $sourceRevision = (& git rev-parse "$tag^{}").Trim()
          }
          elseif ($releaseIsDraft) {
              $sourceRevision = [string]$matchingReleases[0].target_commitish
          }
          if ($sourceRevision -notmatch '^[0-9a-f]{40}$') {
              throw "MCP publication source revision is invalid: '$sourceRevision'."
          }
          if ($sourceRevision -ne $requestedSourceRevision) {
              throw "Existing MCP publication state targets '$sourceRevision', not requested source '$requestedSourceRevision'."
          }
          & git merge-base --is-ancestor $sourceRevision origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "MCP publication source '$sourceRevision' is not in current main history."
          }

          "state=$state" >> $env:GITHUB_OUTPUT
          "source_revision=$sourceRevision" >> $env:GITHUB_OUTPUT
          "tag_exists=$($tagExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Checkout publication source
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ steps.preflight.outputs.source_revision }}
        run: git checkout --detach $env:SOURCE_REVISION

      - name: Validate committed release inputs
        shell: pwsh
        env:
          MCP_VERSION: ${{ inputs.version }}
        run: |
          . .\scripts\Validate-McpReleasePublication.ps1
          Test-McpReleasePublicationInputs -RepoRoot $PWD -Version $env:MCP_VERSION

      - name: Run release script tests
        shell: pwsh
        run: >-
          pwsh -NoProfile -File scripts\Invoke-ScriptTests.ps1
          -TestPath tests\scripts
          -ResultPath TestResults\pester\script-tests.xml

      - name: Upload MCP Release script test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-release-script-test-diagnostics
          path: TestResults\pester\script-tests.xml
          if-no-files-found: warn

      - name: Run serial MCP tests
        run: dotnet test tests\Glasswork.Mcp.Tests\Glasswork.Mcp.Tests.csproj --configuration Release --nologo --verbosity minimal -- MSTest.Parallelize.Workers=1

      - name: Build and pack MCP
        id: package
        shell: pwsh
        env:
          MCP_VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ steps.preflight.outputs.source_revision }}
        run: |
          $ErrorActionPreference = "Stop"
          $outputDirectory = "artifacts\mcp-release"
          if (Test-Path $outputDirectory) {
              Remove-Item -Recurse -Force $outputDirectory
          }
          New-Item -ItemType Directory -Path $outputDirectory | Out-Null

          dotnet build src\Glasswork.Mcp\Glasswork.Mcp.csproj `
              --configuration Release `
              --nologo `
              --verbosity minimal `
              "-p:RepositoryCommit=$env:SOURCE_REVISION"
          if ($LASTEXITCODE -ne 0) {
              throw "MCP Release build failed."
          }

          dotnet pack src\Glasswork.Mcp\Glasswork.Mcp.csproj `
              --configuration Release `
              --no-build `
              --output $outputDirectory `
              --nologo `
              --verbosity minimal `
              "-p:RepositoryCommit=$env:SOURCE_REVISION"
          if ($LASTEXITCODE -ne 0) {
              throw "MCP pack failed."
          }

          $packages = @(Get-ChildItem $outputDirectory -Filter "*.nupkg" -File)
          if ($packages.Count -ne 1) {
              throw "MCP pack must produce exactly one .nupkg; found $($packages.Count)."
          }

          . .\scripts\Validate-McpReleasePublication.ps1
          $artifact = Test-McpPackageArtifact `
              -PackagePath $packages[0].FullName `
              -Version $env:MCP_VERSION `
              -SourceRevision $env:SOURCE_REVISION
          "package_path=$($artifact.PackagePath)" >> $env:GITHUB_OUTPUT
          "checksum_path=$($artifact.ChecksumPath)" >> $env:GITHUB_OUTPUT
          "sha256=$($artifact.Sha256)" >> $env:GITHUB_OUTPUT

      - name: Create or resume draft MCP Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCP_VERSION: ${{ inputs.version }}
          PUBLICATION_STATE: ${{ steps.preflight.outputs.state }}
          SOURCE_REVISION: ${{ steps.preflight.outputs.source_revision }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "mcp-v$env:MCP_VERSION"
          $notesPath = "artifacts\mcp-release-notes.md"
          @(
              "# glasswork-mcp v$env:MCP_VERSION",
              "",
              "This release publishes the independently versioned Glasswork MCP global tool.",
              "See src/Glasswork.Mcp/CHANGELOG.md at commit $env:SOURCE_REVISION for changes."
          ) -join "`n" | Set-Content $notesPath

          if ($env:PUBLICATION_STATE -ne "ResumeDraft") {
              $createArgs = @(
                  "release", "create", $tag,
                  "--repo", $env:GITHUB_REPOSITORY,
                  "--draft",
                  "--target", $env:SOURCE_REVISION,
                  "--title", "glasswork-mcp v$env:MCP_VERSION",
                  "--notes-file", $notesPath
              )
              & gh @createArgs
              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to create draft MCP GitHub Release."
              }
          }
          else {
              gh release edit $tag `
                  --repo $env:GITHUB_REPOSITORY `
                  --draft `
                  --title "glasswork-mcp v$env:MCP_VERSION" `
                  --notes-file $notesPath
              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to refresh draft MCP GitHub Release."
              }
          }

      - name: Upload and verify draft assets
        id: assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCP_VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ steps.preflight.outputs.source_revision }}
          TAG_EXISTS: ${{ steps.preflight.outputs.tag_exists }}
          LOCAL_PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "mcp-v$env:MCP_VERSION"
          if ($env:TAG_EXISTS -ne "true") {
              gh release upload $tag `
                  --repo $env:GITHUB_REPOSITORY `
                  --clobber `
                  $env:PACKAGE_PATH `
                  $env:CHECKSUM_PATH
              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to upload MCP Release assets."
              }
          }

          $verificationDirectory = "artifacts\mcp-release-verification"
          New-Item -ItemType Directory -Force -Path $verificationDirectory | Out-Null
          gh release download $tag `
              --repo $env:GITHUB_REPOSITORY `
              --clobber `
              --dir $verificationDirectory `
              --pattern "glasswork-mcp.$env:MCP_VERSION.nupkg" `
              --pattern "glasswork-mcp.$env:MCP_VERSION.nupkg.sha256"
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to download MCP Release assets for verification."
          }

          . .\scripts\Validate-McpReleasePublication.ps1
          $packagePath = Join-Path $verificationDirectory "glasswork-mcp.$env:MCP_VERSION.nupkg"
          $checksumPath = "$packagePath.sha256"
          $expectedSha256 = $env:LOCAL_PACKAGE_SHA256
          if ($env:TAG_EXISTS -eq "true") {
              $tagMetadata = ConvertFrom-McpTagMessage `
                  -Message ((& git tag -l $tag --format="%(contents)") -join "`n") `
                  -Version $env:MCP_VERSION
              if ($tagMetadata.SourceRevision -ne $env:SOURCE_REVISION) {
                  throw "Existing MCP integrity tag targets different package source."
              }
              $expectedSha256 = $tagMetadata.Sha256
          }
          $artifact = Test-McpPackageIntegrity `
              -PackagePath $packagePath `
              -ChecksumPath $checksumPath `
              -Version $env:MCP_VERSION `
              -SourceRevision $env:SOURCE_REVISION `
              -ExpectedSha256 $expectedSha256
          "sha256=$($artifact.Sha256)" >> $env:GITHUB_OUTPUT

      - name: Create or verify annotated MCP integrity tag
        shell: pwsh
        env:
          MCP_VERSION: ${{ inputs.version }}
          PACKAGE_SHA256: ${{ steps.assets.outputs.sha256 }}
          SOURCE_REVISION: ${{ steps.preflight.outputs.source_revision }}
          TAG_EXISTS: ${{ steps.preflight.outputs.tag_exists }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "mcp-v$env:MCP_VERSION"
          if ($env:TAG_EXISTS -eq "true") {
              if ((& git cat-file -t $tag).Trim() -ne "tag") {
                  throw "Existing MCP tag '$tag' is not annotated."
              }
              $target = (& git rev-parse "$tag^{}").Trim()
              if ($target -ne $env:SOURCE_REVISION) {
                  throw "Existing MCP tag targets '$target', not '$env:SOURCE_REVISION'."
              }
              . .\scripts\Validate-McpReleasePublication.ps1
              $metadata = ConvertFrom-McpTagMessage `
                  -Message ((& git tag -l $tag --format="%(contents)") -join "`n") `
                  -Version $env:MCP_VERSION
              if ($metadata.SourceRevision -ne $env:SOURCE_REVISION -or
                  $metadata.Sha256 -ne $env:PACKAGE_SHA256) {
                  throw "Existing MCP tag metadata does not match the package."
              }
          }
          else {
              $message = @(
                  "glasswork-mcp publication",
                  "version: $env:MCP_VERSION",
                  "commit: $env:SOURCE_REVISION",
                  "sha256: $env:PACKAGE_SHA256"
              ) -join "`n"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a $tag $env:SOURCE_REVISION -m $message
              $credential = [Convert]::ToBase64String(
                  [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:APP_TOKEN"))
              Write-Output "::add-mask::$credential"
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $credential" `
                  push origin "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to push annotated MCP integrity tag."
              }
          }

      - name: Publish verified MCP Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCP_VERSION: ${{ inputs.version }}
        run: |
          $tag = "mcp-v$env:MCP_VERSION"
          gh release edit $tag --draft=false --verify-tag --latest=false `
              --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to publish verified MCP GitHub Release."
          }

      - name: Verify published MCP Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCP_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "mcp-v$env:MCP_VERSION"
          $release = gh release view $tag `
              --repo $env:GITHUB_REPOSITORY `
              --json tagName,isDraft,isPrerelease,assets |
              ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to verify MCP GitHub Release '$tag'."
          }
          if ($release.tagName -ne $tag -or $release.isDraft -or $release.isPrerelease) {
              throw "MCP GitHub Release metadata is invalid."
          }

          $assetNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($requiredAsset in @(
                  "glasswork-mcp.$env:MCP_VERSION.nupkg",
                  "glasswork-mcp.$env:MCP_VERSION.nupkg.sha256")) {
              if ($assetNames -notcontains $requiredAsset) {
                  throw "MCP GitHub Release is missing asset '$requiredAsset'."
              }
          }

      - name: Close recovered MCP release blocker
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pwsh -File scripts\Invoke-ReleaseEvaluation.ps1 `
              -Mode CloseBlocker `
              -Stream Mcp `
              -Repository $env:GITHUB_REPOSITORY `
              -BlockerStage Publication `
              -SummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Record MCP publication blocker
        if: failure() && steps.app-token.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          "MCP publication failed. Inspect this workflow run." |
              Set-Content artifacts\mcp-publication-error.txt
          pwsh -File scripts\Invoke-ReleaseEvaluation.ps1 `
              -Mode RecordFailure `
              -Stream Mcp `
              -Repository $env:GITHUB_REPOSITORY `
              -BlockerStage Publication `
              -FailurePath artifacts\mcp-publication-error.txt `
              -SummaryPath $env:GITHUB_STEP_SUMMARY
