name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src\Glasswork.App\Glasswork.csproj
          dotnet restore tests\Glasswork.Mcp.Tests\Glasswork.Mcp.Tests.csproj
          dotnet restore tests\Glasswork.CanvasHost.Tests\Glasswork.CanvasHost.Tests.csproj

      - name: Lint
        shell: pwsh
        run: |
          dotnet format src\Glasswork.Core\Glasswork.Core.csproj analyzers --verify-no-changes --verbosity minimal
          dotnet format src\Glasswork.Mcp\Glasswork.Mcp.csproj analyzers --verify-no-changes --verbosity minimal
          dotnet format tests\Glasswork.Tests\Glasswork.Tests.csproj analyzers --verify-no-changes --verbosity minimal
          dotnet format tests\Glasswork.Mcp.Tests\Glasswork.Mcp.Tests.csproj analyzers --verify-no-changes --verbosity minimal
          dotnet format src\Glasswork.App\Glasswork.csproj analyzers --verify-no-changes --verbosity minimal
          dotnet format tools\Glasswork.CanvasHost\Glasswork.CanvasHost.csproj analyzers --verify-no-changes --verbosity minimal
          dotnet format tests\Glasswork.CanvasHost.Tests\Glasswork.CanvasHost.Tests.csproj analyzers --verify-no-changes --verbosity minimal

      - name: Typecheck
        shell: pwsh
        run: |
          dotnet build src\Glasswork.Core\Glasswork.Core.csproj --configuration Release --no-restore --nologo --verbosity minimal
          dotnet build src\Glasswork.Mcp\Glasswork.Mcp.csproj --configuration Release --no-restore --nologo --verbosity minimal

      - name: Build canvas host (debug)
        shell: pwsh
        # Glasswork.CanvasHost.Tests spawns the host as a child process from its
        # Debug output path regardless of the test project's own configuration,
        # so a Debug build must exist before the canvas host tests run.
        run: dotnet build tools\Glasswork.CanvasHost\Glasswork.CanvasHost.csproj --configuration Debug --no-restore --nologo --verbosity minimal

      - name: Test
        shell: pwsh
        run: |
          dotnet test tests\Glasswork.Tests\Glasswork.Tests.csproj --configuration Release --no-restore --nologo --verbosity minimal -- MSTest.Parallelize.Workers=1
          dotnet test tests\Glasswork.Mcp.Tests\Glasswork.Mcp.Tests.csproj --configuration Release --no-restore --nologo --verbosity minimal
          dotnet test tests\Glasswork.CanvasHost.Tests\Glasswork.CanvasHost.Tests.csproj --configuration Release --no-restore --nologo --verbosity minimal

      - name: Build
        shell: pwsh
        run: dotnet build src\Glasswork.App\Glasswork.csproj --configuration Release -p:Platform=x64 --no-restore --nologo --verbosity minimal
