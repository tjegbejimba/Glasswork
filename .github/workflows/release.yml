name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in X.Y.Z form"
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate release inputs
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          . .\scripts\Validate-ReleasePublication.ps1
          Test-ReleasePublicationInputs -RepoRoot $PWD -Version $env:RELEASE_VERSION

      - name: Ensure release tag does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v$env:RELEASE_VERSION"

          & git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
              throw "Release tag already exists: $tag"
          }
          if ($LASTEXITCODE -ne 2) {
              throw "Unable to check release tag '$tag' (git exited $LASTEXITCODE)."
          }

          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          $response = Invoke-WebRequest -Uri $releaseUrl -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
              throw "GitHub Release already exists: $tag"
          }
          if ($response.StatusCode -ne 404) {
              throw "Unable to check GitHub Release '$tag' (HTTP $($response.StatusCode))."
          }

      - name: Run release script tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pesterVersion = "5.7.1"
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq [version]$pesterVersion })) {
              Install-Module Pester -RequiredVersion $pesterVersion -Scope CurrentUser -Force
          }
          Invoke-Pester -Path tests\scripts -Output Detailed -CI

      - name: Run Core tests
        run: dotnet test tests\Glasswork.Tests\Glasswork.Tests.csproj --configuration Release --nologo --verbosity minimal -- MSTest.Parallelize.Workers=1

      - name: Build Windows app
        run: dotnet build src\Glasswork.App\Glasswork.csproj --configuration Release -p:Platform=x64 --nologo --verbosity minimal

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $notesPath = "docs\releases\$tag.md"
          $target = (& git rev-parse HEAD).Trim()

          gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --target $target `
            --title "Glasswork $tag" `
            --notes-file $notesPath
