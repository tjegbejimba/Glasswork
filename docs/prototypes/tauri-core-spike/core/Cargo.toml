[package]
name = "glasswork-core-spike"
version = "0.1.0"
edition = "2021"
description = "PROTOTYPE ONLY -- bounded Rust port of the Glasswork vertical slice (Wayfinder ticket #372). Disposable; not production Glasswork.Core."

[lib]
name = "glasswork_core_spike"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
regex = "1"
once_cell = "1"
notify = "6"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
