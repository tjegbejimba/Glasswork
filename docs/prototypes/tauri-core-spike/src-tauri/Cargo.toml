[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glasswork-core-spike = { path = "../core" }
# Automated desktop UI test support (WebdriverIO @wdio/tauri-service, hard
# scorecard gate #5). This is test-only tooling that exposes a WebDriver
# bridge -- acceptable in this disposable spike (never shipped), but would
# need feature-gating out of any real release build.
tauri-plugin-wdio = "1"
tauri-plugin-wdio-webdriver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"

